---
- name: Diagnostic et remédiation contrôlée de Nginx
  hosts: servers
  become: true
  gather_facts: false

  tasks:
    - name: Vérifier l'état de Nginx
      ansible.builtin.command: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: Afficher le diagnostic
      ansible.builtin.debug:
        msg: "État actuel de Nginx sur {{ inventory_hostname }} : {{ nginx_status.stdout | default('inconnu') }}"

    - name: Demander l'autorisation avant toute correction
      ansible.builtin.pause:
        prompt: "Nginx est {{ nginx_status.stdout | default('dans un état inconnu') }}. Tapez OUI pour autoriser son démarrage/redémarrage, ou appuyez sur Entrée pour ne rien modifier"
      register: remediation_consent
      when: nginx_status.stdout != "active"

    - name: Démarrer Nginx si autorisé
      ansible.builtin.service:
        name: nginx
        state: started
      when:
        - nginx_status.stdout != "active"
        - remediation_consent.user_input | default('') == "OUI"
