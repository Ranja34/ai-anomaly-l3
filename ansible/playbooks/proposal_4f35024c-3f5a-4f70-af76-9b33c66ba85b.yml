---\n- name: Diagnostic des erreurs ai‑anomaly‑l3.service et PAM sudo\n  hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Afficher le fichier d'unité ai‑anomaly‑l3.service\n      ansible.builtin.command: systemctl cat ai-anomaly-l3.service\n      register: unit_file\n    - name: Afficher le contenu du fichier d'unité\n      ansible.builtin.debug:\n        var: unit_file.stdout\n    - name: Afficher les 10 dernières entrées du journal du service\n      ansible.builtin.command: journalctl -u ai-anomaly-l3.service --since "10 minutes ago"\n      register: journal_entries\n    - name: Afficher les entrées du journal\n      ansible.builtin.debug:\n        var: journal_entries.stdout\n    - name: Lire le fichier /etc/pam.d/sudo\n      ansible.builtin.slurp:\n        src: /etc/pam.d/sudo\n      register: sudo_pam\n    - name: Afficher le contenu du fichier PAM sudo\n      ansible.builtin.debug:\n        var: sudo_pam.content | b64decode\n    - name: Lister le répertoire /etc/security/tty-permissions.d/\n      ansible.builtin.command: ls -l /etc/security/tty-permissions.d/\n      register: tty_perm\n    - name: Afficher la liste des fichiers TTY permissions\n      ansible.builtin.debug:\n        var: tty_perm.stdout