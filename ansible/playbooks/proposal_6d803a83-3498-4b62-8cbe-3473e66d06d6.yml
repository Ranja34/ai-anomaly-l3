---\n- name: Diagnose frappe-staging issues\n  hosts: frappe-staging\n  gather_facts: false\n  tasks:\n    - name: Retrieve recent ai-anomaly-l3.service logs\n      command: journalctl -u ai-anomaly-l3.service --no-pager -n 100\n      register: openai_logs\n      changed: false\n    - name: Show openai error lines\n      debug:\n        msg: "{{ item }}"\n      loop: "{{ openai_logs.stdout_lines | select('search', 'BadRequestError|RateLimitError') | list }}"\n      when: openai_logs.stdout_lines is defined\n    - name: Retrieve recent sudo logs\n      command: journalctl -u sudo --no-pager -n 100\n      register: sudo_logs\n      changed: false\n    - name: Show sudo pam errors\n      debug:\n        msg: "{{ item }}"\n      loop: "{{ sudo_logs.stdout_lines | select('search', 'pam_unix\(sudo:auth\)') | list }}"\n      when: sudo_logs.stdout_lines is defined\n    - name: Verify /etc/sudoers TTY setting\n      command: grep -i '^Defaults' /etc/sudoers | grep -i 'tty' || true\n      register: tty_setting\n      changed: false\n    - name: Output sudoers TTY configuration\n      debug:\n        var: tty_setting.stdout_lines\n    - name: Check existence of JSON validator tool\n      stat:\n        path: /usr/local/bin/json_validator\n      register: json_validator\n      changed: false\n    - name: Report JSON validator presence\n      debug:\n        var: json_validator.stat.exists\n