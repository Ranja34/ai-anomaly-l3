---
- name: Remédiation Nginx
  hosts: servers
  gather_facts: false
  become: false

  tasks:
    - name: Démarrer Nginx avec sudo limité
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /bin/systemctl
          - start
          - nginx
      register: remediation
      changed_when: remediation.rc == 0
